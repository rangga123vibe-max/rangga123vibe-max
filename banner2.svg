<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .kw   { fill: #FF7B72; }
      .var  { fill: #79C0FF; }
      .fn   { fill: #D2A8FF; }
      .str  { fill: #A5D6FF; }
      .key  { fill: #7EE787; }
      .pun  { fill: #C9D1D9; }
      .com  { fill: #8B949E; }
      .num  { fill: #484F58; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="318" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="26" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="66" cy="21" r="6" fill="#27C93F"/>
  <text x="90" y="26" font-size="13" class="com">arangga.profile.ts</text>
  <line x1="1" y1="42" x2="899" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- line numbers -->
  <g font-size="13" class="num" text-anchor="end">
    <text x="52" y="70">1</text>
    <text x="52" y="100">2</text>
    <text x="52" y="128">3</text>
    <text x="52" y="156">4</text>
    <text x="52" y="184">5</text>
    <text x="52" y="212">6</text>
    <text x="52" y="240">7</text>
  </g>
  <line x1="66" y1="48" x2="66" y2="300" stroke="#21262D" stroke-width="1"/>

  <!-- code -->
  <g font-size="16">
    <text x="80" y="70" class="com">// github.com/rangga123vibe-max</text>

    <text x="80" y="100"><tspan class="kw">const</tspan><tspan class="pun"> mahatma </tspan><tspan class="pun">=</tspan><tspan class="pun"> </tspan><tspan class="kw">new</tspan><tspan class="fn"> Engineer</tspan><tspan class="pun">({</tspan></text>

    <text x="80" y="128"><tspan class="pun">  </tspan><tspan class="var">name</tspan><tspan class="pun">: </tspan><tspan class="str">"Mahatma Arangga"</tspan><tspan class="pun">,</tspan></text>

    <text x="80" y="156"><tspan class="pun">  </tspan><tspan class="var">role</tspan><tspan class="pun">: </tspan><tspan class="str">"Software Engineer"</tspan><tspan class="pun">,</tspan></text>

    <text x="80" y="184"><tspan class="pun">  </tspan><tspan class="var">focus</tspan><tspan class="pun">: [</tspan><tspan class="str">"React"</tspan><tspan class="pun">, </tspan><tspan class="str">"Node.js"</tspan><tspan class="pun">, </tspan><tspan class="str">"TypeScript"</tspan><tspan class="pun">],</tspan></text>

    <text x="80" y="212"><tspan class="pun">  </tspan><tspan class="var">status</tspan><tspan class="pun">: </tspan><tspan class="str">"open to collaborate"</tspan><tspan class="pun">,</tspan></text>

    <text x="80" y="240"><tspan class="pun">});</tspan><tspan class="pun" id="cursor">▍</tspan></text>
  </g>

  <animate xlink:href="#cursor" attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>

  <line x1="1" y1="270" x2="899" y2="270" stroke="#21262D" stroke-width="1"/>
  <circle cx="82" cy="292" r="4" fill="#3FB950"/>
  <text x="94" y="297" font-size="13" class="com">available for new projects</text>
</svg>
