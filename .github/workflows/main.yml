name: generate profile assets
on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          gameTheme: 'github-dark'
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Anime watchers
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites,watching
          plugin_anilist_limit: 4
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.dark.svg
          token: NOT_NEEDED
          base: ""
          theme: dark
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites,watching
          plugin_anilist_limit: 4

      # Manga readers
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.manga.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites,reading
          plugin_anilist_limit: 4
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.manga.dark.svg
          token: NOT_NEEDED
          base: ""
          theme: dark
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites,reading
          plugin_anilist_limit: 4

      # Favorite characters
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.characters.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 22
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.characters.dark.svg
          token: NOT_NEEDED
          base: ""
          theme: dark
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 22
