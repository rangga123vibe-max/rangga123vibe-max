name: generate profile assets
on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          gameTheme: 'github-dark'
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Anime watchers
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites,watching
          plugin_anilist_limit: 4
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.dark.svg
          token: NOT_NEEDED
          base: ""
          theme: dark
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites,watching
          plugin_anilist_limit: 4
      # Manga readers
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.manga.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites,reading
          plugin_anilist_limit: 4
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.manga.dark.svg
          token: NOT_NEEDED
          base: ""
          theme: dark
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites,reading
          plugin_anilist_limit: 4
      # Favorite characters
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.characters.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 22
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.anilist.characters.dark.svg
          token: NOT_NEEDED
          base: ""
          theme: dark
          plugin_anilist: yes
          plugin_anilist_user: rangga123konz
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 22

  streak:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=rangga123vibe-max&theme=highcontrast&background=0B0B12&ring=F472B6&fire=A78BFA&currStreakLabel=F9A8D4&sideLabels=E5E7EB&currStreakNum=FFFFFF&sideNums=FFFFFF
          path: streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
