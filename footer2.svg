<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="fcard2">
      <rect width="900" height="140" rx="16"/>
    </clipPath>
    <linearGradient id="skyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#181026"/>
    </linearGradient>
    <filter id="fglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <g id="gpetal">
      <g fill="#F9A8D4">
        <path d="M-1.2,-0.8 C-3.8,-2.8 -4.3,-7.5 0,-10.5 C4.3,-7.5 3.8,-2.8 1.2,-0.8 Z"/>
        <path d="M-1.2,-0.8 C-3.8,-2.8 -4.3,-7.5 0,-10.5 C4.3,-7.5 3.8,-2.8 1.2,-0.8 Z" transform="rotate(70)"/>
        <path d="M-1.2,-0.8 C-3.8,-2.8 -4.3,-7.5 0,-10.5 C4.3,-7.5 3.8,-2.8 1.2,-0.8 Z" transform="rotate(146)"/>
        <path d="M-1.2,-0.8 C-3.8,-2.8 -4.3,-7.5 0,-10.5 C4.3,-7.5 3.8,-2.8 1.2,-0.8 Z" transform="rotate(212)"/>
        <path d="M-1.2,-0.8 C-3.8,-2.8 -4.3,-7.5 0,-10.5 C4.3,-7.5 3.8,-2.8 1.2,-0.8 Z" transform="rotate(288)"/>
      </g>
      <circle r="1.4" fill="#FDE9C8"/>
    </g>
  </defs>

  <g clip-path="url(#fcard2)">
    <rect width="900" height="140" fill="url(#skyDark)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle cx="240" cy="20" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="45" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="18" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="55" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="25" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.3s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="65" r="1" opacity="0.4"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="15" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.7s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- crescent moon -->
    <circle cx="805" cy="42" r="46" fill="#FDF2E3" opacity="0.1" filter="url(#fglow)"/>
    <circle cx="805" cy="42" r="24" fill="#FDF2E3"/>
    <circle cx="795" cy="33" r="20" fill="#0B0B12"/>

    <!-- glowing blossom cluster, left side -->
    <g filter="url(#fglow)" opacity="0.55">
      <circle cx="50" cy="60" r="30" fill="#F9A8D4"/>
      <circle cx="130" cy="95" r="24" fill="#F472B6"/>
      <circle cx="90" cy="130" r="20" fill="#F9A8D4"/>
      <circle cx="30" cy="115" r="18" fill="#F472B6"/>
    </g>

    <g stroke="#2A1A22" fill="none" stroke-linecap="round">
      <path d="M -10,60 C 20,55 35,70 55,60 C 75,50 90,65 110,58" stroke-width="3"/>
      <path d="M 55,60 C 60,80 75,95 70,115" stroke-width="2.4"/>
      <path d="M 30,90 C 25,100 15,105 10,118" stroke-width="2"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <use href="#gpetal" transform="translate(50,60) scale(1.4)"/>
      <use href="#gpetal" transform="translate(70,45) scale(1.1) rotate(20)"/>
      <use href="#gpetal" transform="translate(30,75) scale(1.0) rotate(-15)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      <use href="#gpetal" transform="translate(130,95) scale(1.3)"/>
      <use href="#gpetal" transform="translate(150,80) scale(1.0) rotate(15)"/>
      <use href="#gpetal" transform="translate(112,110) scale(0.9) rotate(-20)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      <use href="#gpetal" transform="translate(90,130) scale(1.1)"/>
      <use href="#gpetal" transform="translate(105,118) scale(0.85) rotate(25)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="3.8s" begin="1.4s" repeatCount="indefinite"/>
      <use href="#gpetal" transform="translate(28,112) scale(1.0)"/>
      <use href="#gpetal" transform="translate(12,125) scale(0.75) rotate(-15)"/>
    </g>
    <use href="#gpetal" transform="translate(160,60) scale(0.6) rotate(15)"/>
    <use href="#gpetal" transform="translate(185,75) scale(0.5) rotate(-10)"/>

    <!-- drifting falling petals -->
    <g transform="translate(250,-10)">
      <animateTransform attributeName="transform" type="translate" values="250,-10; 270,45; 240,95; 265,140; 250,10" dur="8s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.8s" repeatCount="indefinite"/><use href="#gpetal" transform="scale(0.6)"/></g>
    </g>
    <g transform="translate(550,-20)">
      <animateTransform attributeName="transform" type="translate" values="550,-20; 530,40; 560,90; 535,135; 550,0" dur="9.5s" begin="2s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="3.2s" repeatCount="indefinite"/><use href="#gpetal" transform="scale(0.5)"/></g>
    </g>
    <g transform="translate(430,-15)">
      <animateTransform attributeName="transform" type="translate" values="430,-15; 450,40; 420,90; 445,135; 430,5" dur="10s" begin="4s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/><use href="#gpetal" transform="scale(0.45)"/></g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="139" rx="16" fill="none" stroke="#F9A8D4" stroke-opacity="0.15"/>
</svg>
